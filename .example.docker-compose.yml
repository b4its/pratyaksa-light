# ============================================================
# CONTOH alternatif docker-compose (tanpa profile).
#
# Docker compose utama (docker-compose.yml) memakai `profiles` sehingga
# service tidak ikut jalan kecuali profilnya diaktifkan:
#     docker compose --profile full up -d
#
# File INI menghapus mekanisme profile dan hanya menyertakan service inti
# (postgres, mongodb, backend, frontend, nginx) supaya `docker compose up -d`
# langsung menyalakan seluruh stack.
#
# Salin menjadi docker-compose.yml jika ingin gaya tanpa profile.
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: py-pratyaksa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pratyaksa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pratyaksa_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pratyaksa_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pratyaksa} -d ${POSTGRES_DB:-pratyaksa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pratyaksa-net

  mongodb:
    image: mongo:7.0
    container_name: py-pratyaksa-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-pratyaksa}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-pratyaksa_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-pratyaksa}
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pratyaksa-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: py-pratyaksa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-pratyaksa}:${POSTGRES_PASSWORD:-pratyaksa_secret}@postgres:5432/${POSTGRES_DB:-pratyaksa_db}
      MONGODB_URL: mongodb://${MONGO_USER:-pratyaksa}:${MONGO_PASSWORD:-pratyaksa_secret}@mongodb:27017
      MONGODB_NAME: ${MONGO_DB:-pratyaksa}
      JWT_SECRET: ${JWT_SECRET:-super_secret_pratyaksa_key_change_in_production}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      PRATYAKSA_API_URL: ${ML_TARGET_URL:-http://192.168.101.3:6000}
      PRATYAKSA_API_KEY: ${LIVE_API_KEY:-dev-key-pratyaksa}
      TELEGRAM_GRPC_TARGET: ${TELEGRAM_GRPC_TARGET:-telegram-bot:50051}
      MEDIA_DIR: /app/media/models
    volumes:
      - media_models:/app/media/models
    expose:
      - "8080"
    networks:
      - pratyaksa-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://0.0.0.0:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  telegram-bot:
    build:
      context: ./telegram_bot_grpc
      dockerfile: Dockerfile
    container_name: py-pratyaksa-telegram-bot
    restart: unless-stopped
    environment:
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-token}
      BACKEND_URL: ${BOT_BACKEND_URL:-http://backend:8080}
      WO_LINK_BASE: ${WO_LINK_BASE:-http://10.40.2.117}
      SUBSCRIBERS_FILE: /app/data/subscribers.json
    volumes:
      - bot_data:/app/data
    expose:
      - "50051"
    networks:
      - pratyaksa-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_BASE: /api/v1
    container_name: py-pratyaksa-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PUBLIC_API_BASE: /api/v1
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    networks:
      - pratyaksa-net

  nginx:
    image: nginx:1.27-alpine
    container_name: py-pratyaksa-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - pratyaksa-net

volumes:
  postgres_data:
    name: py_pratyaksa_postgres_data
  mongo_data:
    name: py_pratyaksa_mongo_data
  media_models:
    name: py_pratyaksa_media_models
  bot_data:
    name: py_pratyaksa_bot_data

networks:
  pratyaksa-net:
    name: py-pratyaksa-network
    driver: bridge
