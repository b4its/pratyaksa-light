services:

  # ============================================================
  # DATABASE SERVICES (profile: db)
  # ============================================================

  postgres:
    image: postgres:16-alpine
    container_name: py-pratyaksa-postgres
    profiles: ["db", "backend", "full"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pratyaksa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pratyaksa_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pratyaksa_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pratyaksa} -d ${POSTGRES_DB:-pratyaksa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pratyaksa-net

  mongodb:
    image: mongo:7.0
    container_name: py-pratyaksa-mongodb
    profiles: ["db", "backend", "full"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-pratyaksa}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-pratyaksa_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-pratyaksa}
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pratyaksa-net

  # ============================================================
  # BACKEND SERVICE — Python + FastAPI (profile: backend)
  # ============================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: py-pratyaksa-backend
    profiles: ["backend", "full"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-pratyaksa}:${POSTGRES_PASSWORD:-pratyaksa_secret}@postgres:5432/${POSTGRES_DB:-pratyaksa_db}
      MONGODB_URL: mongodb://${MONGO_USER:-pratyaksa}:${MONGO_PASSWORD:-pratyaksa_secret}@mongodb:27017
      MONGODB_NAME: ${MONGO_DB:-pratyaksa}
      JWT_SECRET: ${JWT_SECRET:-super_secret_pratyaksa_key_change_in_production}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      PRATYAKSA_API_URL: ${ML_TARGET_URL:-http://ml-api:6000}
      PRATYAKSA_API_KEY: ${LIVE_API_KEY:-dev-key-pratyaksa}
      ML_POSTGRES_URL: ${ML_POSTGRES_URL:-postgresql://pratyaksa:pratyaksa_secret@ml-postgres:5432/pratyaksa}
      PRATYAKSA_POLL_INTERVAL: ${PRATYAKSA_POLL_INTERVAL:-5}
      ML_SYNC_INTERVAL: ${ML_SYNC_INTERVAL:-60}
      MONGO_BATCH_SIZE: ${MONGO_BATCH_SIZE:-100}
      TELEGRAM_GRPC_TARGET: ${TELEGRAM_GRPC_TARGET:-telegram-bot:50051}
      MEDIA_DIR: /app/media/models
    volumes:
      - media_models:/app/media/models
    expose:
      - "8080"
    networks:
      - pratyaksa-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://0.0.0.0:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # ============================================================
  # FRONTEND SERVICE — SvelteKit (profile: full)
  # ============================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_BASE: /api/v1
    container_name: py-pratyaksa-frontend
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PUBLIC_API_BASE: /api/v1
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    networks:
      - pratyaksa-net

  # ============================================================
  # NGINX — Reverse proxy, single entry point (profile: full)
  #   /api/*  -> backend:8080
  #   /svc/*  -> backend:8080
  #   /*      -> frontend:3000
  # ============================================================

  nginx:
    image: nginx:1.27-alpine
    container_name: py-pratyaksa-nginx
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - pratyaksa-net

  # ============================================================
  # OPTIONAL: Mongo Express UI (profile: tools)
  # ============================================================

  mongo-express:
    image: mongo-express:1.0.2
    container_name: py-pratyaksa-mongo-express
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-pratyaksa}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-pratyaksa_secret}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-pratyaksa}:${MONGO_PASSWORD:-pratyaksa_secret}@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    networks:
      - pratyaksa-net

  # ============================================================
  # OPTIONAL: pgAdmin UI (profile: tools)
  # ============================================================

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: py-pratyaksa-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pratyaksa.id}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - pratyaksa-net

volumes:
  postgres_data:
    name: py_pratyaksa_postgres_data
  mongo_data:
    name: py_pratyaksa_mongo_data
  pgadmin_data:
    name: py_pratyaksa_pgadmin_data
  media_models:
    name: py_pratyaksa_media_models

networks:
  pratyaksa-net:
    name: py-pratyaksa-network
    driver: bridge
